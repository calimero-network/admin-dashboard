name: Doc Auto-Update

# Manual only. The push trigger never actually ran (see the pin below), so
# keeping it would quietly START spending API credit and opening doc PRs on
# every merge the moment the ref resolves.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to generate docs for (leave blank to auto-detect)'
        type: string
        required: false
      dry_run:
        description: 'Dry run: print changes without opening a PR'
        type: boolean
        default: false

# Nothing here needs more than the called workflow's own job asks for.
permissions:
  contents: read

jobs:
  doc-update:
    # Pinned by SHA: this job is handed GH_PAT and ANTHROPIC_API_KEY, so a
    # moving ref would let whoever moves it read them. (`@main` never existed —
    # the repo's default branch is master — so every run so far failed to start.)
    permissions:
      contents: write
      pull-requests: write
    uses: calimero-network/ai-code-reviewer/.github/workflows/doc-update.yaml@a065f220db4648dc0f01cd93bb4af9c832b80193 # master
    with:
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      pr_number: ${{ github.event.inputs.pr_number }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
