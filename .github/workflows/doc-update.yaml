name: Doc Auto-Update

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to generate docs for (leave blank to auto-detect)'
        type: string
        required: false
      dry_run:
        description: 'Dry run: print changes without opening a PR'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  doc-update:
    permissions:
      contents: write
      pull-requests: write
    uses: calimero-network/ai-code-reviewer/.github/workflows/doc-update.yaml@a065f220db4648dc0f01cd93bb4af9c832b80193 # master
    with:
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      pr_number: ${{ github.event.inputs.pr_number }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
